<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3K SIDEQUESTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+25&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f5f5;
    --accent: #1a1a1a;
    --text: #1a1a1a;
    --muted: #6e6e6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
.logo-container {
  width: 100%;
  display: flex;
  justify-content: center;
}

.logo-link {
  display: inline-block;
  color: inherit;
  text-decoration: none;
}

.logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  cursor: pointer;
}

.logo-wrap img {
  display: block;
  width: auto;
  height: 90px;
}

h1.title {
  margin: 0;
  font-family: 'Jersey 10', sans-serif;
  font-size: 3.2rem;
  letter-spacing: 2px;
  color: var(--accent);
  line-height: 1;
}

@media (max-width: 520px) {
  .logo-wrap {
    gap: 10px;
  }

  .logo-wrap img {
    height: 60px;
  }

  h1.title {
    font-size: 2.2rem;
  }
}
  h2.subtitle {
    font-family: 'Jersey 25', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 1px;
    color: var(--text);
    margin: 6px 0 30px;
    text-align: center;
    opacity: 0.9;
  }
  .container {
    max-width: 640px;
    width: 100%;
  }
  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 22px 26px;
    margin-bottom: 18px;
    border: 1px solid #dcdcdc;
  }
  .card h3 {
    font-family: 'Jersey 25', sans-serif;
    font-size: 1.3rem;
    color: var(--accent);
    margin: 0 0 10px;
    letter-spacing: 1px;
  }
  .card p, .card li {
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text);
  }
  .card a {
    color: var(--accent);
    text-decoration: none;
  }
    
  .card a:hover { text-decoration: underline; }
  ul { padding-left: 18px; margin: 0; }
  footer {
    margin-top: 30px;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body>
<br><br><br><br><br><br><br><br><br><br>
  <div class="logo-container">
  <a class="logo-link" href="midimachine/index.html">
    <div class="logo-wrap">
      <img
        src="midimachine/landing_page_logo.png"
        alt="MIDI MACHINE logo"
      >
      <h1 class="title">MIDI MACHINE</h1>
    </div>
  </a>
</div>
  <br><br><br><br><br><br><br><br><br><br>
  <footer>3K SIDEQUESTS — © 2026 NIKKI3K</footer>

</body>
</html>
